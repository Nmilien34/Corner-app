<!doctype html>
<html><head><meta charset="utf-8"><title>Corner spike — offset to rect</title>
<style>
  :root { --bg:#14161a; --fg:#e8eaed; --dim:#9aa0a6; --ok:#34c759; --bad:#ff453a; --hl:rgba(255,214,0,.42); }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  #bar { position:fixed; inset:0 0 auto 0; z-index:10; background:#1c1f24; border-bottom:1px solid #2c3038;
         padding:8px 12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #bar input { background:#0f1114; color:var(--fg); border:1px solid #333; padding:4px 6px; width:90px; font:inherit; }
  #bar button { background:#2c3038; color:var(--fg); border:1px solid #3a3f47; padding:4px 10px; cursor:pointer; font:inherit; }
  #bar button:hover { background:#3a3f47 }
  #status { margin-left:auto; color:var(--dim) }
  #viewer { margin-top:46px; height:calc(100vh - 46px); overflow:auto; position:relative; }
  .page { position:relative; margin:12px auto; background:#fff; box-shadow:0 1px 6px rgba(0,0,0,.5); }
  .page canvas { display:block }
  .textLayer { position:absolute; inset:0; overflow:hidden; opacity:.22; line-height:1; }
  .textLayer span { position:absolute; white-space:pre; transform-origin:0 0; color:#0af; cursor:text; }
  .textLayer br { position:absolute }
  .placeholder { display:flex; align-items:center; justify-content:center; color:#888; background:#f4f4f4; }
  .hl { position:absolute; background:var(--hl); pointer-events:none; outline:1px solid rgba(255,180,0,.9); }
  #log { position:fixed; right:10px; bottom:10px; width:430px; max-height:44vh; overflow:auto;
         background:#0f1114ee; border:1px solid #2c3038; padding:8px; white-space:pre-wrap; font-size:11.5px; }
  .ok{color:var(--ok)} .bad{color:var(--bad)} .dim{color:var(--dim)}
</style></head>
<body>
<div id="bar">
  <span>char range</span>
  <input id="from" type="number" value="0">
  <input id="to" type="number" value="0">
  <button id="go">highlight</button>
  <button id="rand">random sentence</button>
  <button id="verify">run round-trip suite</button>
  <span>zoom</span>
  <button id="zout">−</button><button id="zin">+</button>
  <span id="status">loading…</span>
</div>
<div id="viewer"></div>
<pre id="log"></pre>
<script type="module" src="./harness.js"></script>
</body></html>
