# Two services from one repo: the API and the background worker.
#
# BOTH ARE DEPLOYED. corner-backend serves HTTP; corner-worker polls the
# Mongo-backed job queue. They build from the same commit but deploy
# INDEPENDENTLY, and on 2026-08-28 they drifted: the worker ran current code
# while the web service served a build from two commits earlier, returning 501
# from handlers that had been implemented. /healthz now reports the running
# commit and service name so that state is one curl away rather than a
# diagnosis (see lib/build-info.ts).
#
# Leanient's root manifest is the shape being followed (Pepta has none). The
# worker is the addition — parsing, embedding, narration and extraction are all
# far too slow for a request cycle.

# THE corner-secrets ENVIRONMENT GROUP IS AUTHORITATIVE.
#
# Both services pull every shared secret from it via `fromGroup`, and the
# per-service duplicates have been removed so there is exactly one place a
# value can be set. Do not re-add a key here that the group already defines:
# a per-service entry OVERRIDES the group, which reintroduces silent drift
# between the API and the worker — and they must agree on the database, the
# bucket and the JWT secret or the worker processes jobs against different
# infrastructure than the API wrote them to.
#
# Non-secret, per-service values (NODE_ENV, LOG_LEVEL, worker tuning) stay
# inline deliberately: they legitimately differ per service.
#
# `sync: false` means "this value is deliberately NOT in the repo — a human sets
# it in the Render dashboard". Render never invents a value for it, and a
# service that boots without it fails fast at startup by design.
#
# Putting them in a group rather than repeating them per service matters here:
# the web service and the worker need the SAME database and the SAME JWT
# secret. Declared separately, they are two dashboard forms that can drift, and
# a worker pointed at a different database than the API is a genuinely nasty
# failure — the queue looks empty and jobs never run.
envVarGroups:
  - name: corner-secrets
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: EMBEDDINGS_API_KEY
        sync: false
      - key: TTS_API_KEY
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      - key: REVENUECAT_SECRET_API_KEY
        sync: false

services:
  - type: web
    name: corner-backend
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    # --include=dev forces devDependencies (TypeScript, @types/*) to install
    # even though NODE_ENV=production, because the build compiles TS. Runtime
    # only needs dist/.
    buildCommand: npm install --include=dev && npm run build -w @corner/shared && npm run build -w @corner/backend
    startCommand: npm run start -w @corner/backend
    envVars:
      - fromGroup: corner-secrets
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # A REAL AWS region — "auto" is an R2-ism the AWS SDK rejects.
      # Deliberately inter-region: the bucket is us-east-2, Render is Oregon.
      # See docs/costs.md for the reasoning.
      - key: STORAGE_REGION
        value: us-east-2
      - key: STORAGE_BUCKET
        value: corner-documents
      - key: JWT_EXPIRES_IN
        value: 30d

  # Same build, different entry point. The worker polls the Mongo-backed queue;
  # it binds no port and has no health check path, so Render runs it as a
  # background worker rather than a web service.
  - type: worker
    name: corner-worker
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: npm install --include=dev && npm run build -w @corner/shared && npm run build -w @corner/backend
    startCommand: npm run start:worker -w @corner/backend
    envVars:
      - fromGroup: corner-secrets
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # A REAL AWS region — "auto" is an R2-ism the AWS SDK rejects.
      # Deliberately inter-region: the bucket is us-east-2, Render is Oregon.
      # See docs/costs.md for the reasoning.
      - key: STORAGE_REGION
        value: us-east-2
      - key: STORAGE_BUCKET
        value: corner-documents
      - key: JWT_EXPIRES_IN
        value: 30d
      # Lower than the API's: the worker is a background poller, and this
      # cluster also serves a production application.
      - key: MONGODB_MAX_POOL_SIZE
        value: 5
      - key: WORKER_CONCURRENCY
        value: 2
      - key: ORPHAN_GRACE_HOURS
        value: 24
